<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="toggel" onclick="toggel()">Toggel Background color</div>
    <div class="outer-box">
        <div class="card">
            <div class="top">
                <img class="profile-pic" src="mam.jpg" alt="shradhakhapra">
                <div class="user-info">
                    <div class="username">shradha khapra <i class="fa-solid fa-circle-check verified" "></i>
                    <div class=" buttons">
                            <button class="follow">Follow</button>
                            <button class="message">Message</button>
                    </div>
                </div>

                <div class=" stats">
                    <div><span>196 </span>posts</div>
                    <div><span class="counter">569k</span> followers</div>
                    <div><span>4</span> following</div>
                </div>
                <div class="name">shradha khapra</div>
                <div class="link"> @ shradhakhapra</div>
                <div class="bio">
                    Enterprenuer |Ex-Microsoft,DRDO</br>Apna College Co-founder</br>
                    To educate someone is the highest privilege<i class="fa-solid fa-heart" style="color:red;"></i>
                </div>
            </div>

        </div>


    </div>
    <script>
        const body = document.querySelector("body");
        const counter = document.querySelector(".counter");
        let count = 1;
        setInterval(() => {
            if (count < 596) {
                count++;
                counter.innerHTML = count + "k";
            }
        }, 1);


        function toggel() {
            if (body.style.backgroundColor === "black") {
                body.style.backgroundColor = "white";
                body.style.color = "black"
            }
            else {
                body.style.backgroundColor = "black";
                body.style.color = "red";
            }
        }   
    </script>
</body>

</html>
